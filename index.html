<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gintautas Čečys — vadovams ir vadovų komandoms</title>
<meta property="og:title" content="Gintautas Čečys">
<meta property="og:image" content="img/gintautas-cecys.webp">
<meta name="description" content="Gintautas Čečys: 24 metų vadovavimo patirtis, geštalto ir dramos terapija. Sesijos vadovams, užsiėmimai komandoms, pranešimai renginiams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Inter+Tight:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
@keyframes ccFillA{from{width:0}to{width:calc(100% + 16px)}}
@keyframes ccFillB{from{width:0}to{width:calc(100% + 16px)}}
.cc-bar-a{animation:ccFillA 3200ms linear forwards}
.cc-bar-b{animation:ccFillB 3200ms linear forwards}
.cc-bar-first{animation:ccFillA 1400ms linear forwards}
.cc-bar-full{width:calc(100% + 16px)}
@keyframes ccPulse{0%,100%{opacity:1}50%{opacity:.35}}
.cc-dot{animation:ccPulse 1.4s ease-in-out infinite}
#top li button:hover{background:#FFF6F5!important}
@media (prefers-reduced-motion: reduce){.cc-bar-a,.cc-bar-b,.cc-bar-first,.cc-dot{animation:none}}
body{margin:0;background:#FFFFFF;color:#111111;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#B3261E}
</style>
<style>
@media (max-width: 720px){
  #app header{padding:12px 20px!important;gap:12px!important;flex-wrap:nowrap!important}
  #app header > a{font-size:18px!important;white-space:nowrap}
  #app header nav{flex-wrap:nowrap!important;gap:0!important}
  #app header nav a:not(:last-child){display:none!important}
  #app header nav a:last-child{min-height:40px!important;padding:0 14px!important;font-size:14px!important;white-space:nowrap}
  #app [role=group]{display:grid!important;grid-template-columns:1fr 1fr}
  #app [role=group] button:last-child{grid-column:1 / -1}
  #app header nav a:last-child{margin-left:auto;min-height:40px!important;padding:0 14px!important}
  #app [style*="padding: 112px 32px"],#app [style*="padding: 96px 32px"]{padding:56px 20px!important}
  #app [style*="padding: 56px 32px 72px"]{padding:32px 20px 48px!important;gap:36px!important}
  #app [style*="padding: 28px 32px"],#app [style*="padding: 24px 32px"]{padding:20px!important}
  #app h1{font-size:clamp(34px,9.6vw,44px)!important;line-height:1.02!important}
  #app h2[style*="font-size: 44px"]{font-size:32px!important}
  #top p[style*="font-size: 19px"],#app p[style*="font-size: 18px"]{font-size:16px!important}
  #top a[style*="min-height: 54px"]{flex:1 1 200px;justify-content:center}
  #top article{padding:20px!important;box-shadow:6px 6px 0 #111!important;width:calc(100% - 6px)!important}
  #top article > div[aria-hidden]{position:static!important;order:-1;align-self:flex-start;transform:rotate(-3deg)!important;font-size:12px!important}
  #top article li button{font-size:13px!important}
  #app [role=group]{width:100%}
  #app [role=group] button{flex:1 1 auto;padding:0 12px!important;font-size:14px!important}
  #paslaugos article{padding:22px!important}
  #paslaugos article span[style*="font-size: 56px"]{font-size:44px!important}
  #kaip ol{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #kaip ol button{min-height:60px!important;padding:12px!important;gap:10px!important}
  #kaip ol button span:first-child{font-size:22px!important}
  #kaip ol button span:last-child{font-size:15px!important}
  #kaip [aria-live]{padding:22px!important;gap:12px!important}
  #kaip [aria-live] h3{font-size:24px!important}
  [aria-label="Savitikra"] button{font-size:15px!important;padding:10px 14px!important}
  [aria-label="Savitikra"] p[aria-live]{font-size:19px!important}
  [aria-label="Dažni klausimai"] li > button{font-size:17px!important}
  [aria-label="Šiandienos energija"] div[style*="height: 340px"]{height:240px!important;gap:6px!important}
  [aria-label="Šiandienos energija"] div[style*="font-size: 11px"]{display:none!important}
  [aria-label="Šiandienos energija"] button[aria-label]{font-size:14px!important}
  [aria-label="Atsiliepimai"] blockquote{font-size:22px!important}
  #apie img{max-width:100%!important}
  #kontaktai h2{font-size:40px!important}
  footer{flex-direction:column;align-items:flex-start!important;padding:20px!important}
}
</style>
<style>html{scroll-behavior:smooth}*{box-sizing:border-box}img,svg{max-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; background: #FFFFFF; color: #111111; font-family: Inter, system-ui, sans-serif">

<header style="max-width: 1280px; margin: 0 auto; padding: 20px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#top" style="font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; text-decoration: none">Gintautas Čečys<span style="color: {{accent}}">.</span></a>
<nav aria-label="Pagrindinis meniu" style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px; font-weight: 500">
<a href="#paslaugos" style="text-decoration: none">Paslaugos</a>
<a href="#kaip" style="text-decoration: none">Kaip dirbu</a>
<a href="#apie" style="text-decoration: none">Apie</a>
<a href="#kontaktai" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; background: #111111; color: #FFFFFF; text-decoration: none">Pasikalbėkime</a>
</nav>
</header>

<section id="top" style="border-top: 1px solid #111111; border-bottom: 1px solid #111111">
<div style="max-width: 1280px; margin: 0 auto; padding: 56px 32px 72px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #555555">Vadovams ir vadovų komandoms · Vilnius</p>
<h1 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: clamp(46px, 5.8vw, 88px); line-height: 0.98; letter-spacing: -0.035em">Viduje – septyni vyrai. Visi jie dirba jūsų komandai.</h1>
<p style="margin: 0; max-width: 560px; font-size: 19px; line-height: 1.6; color: #3A3A3A">24 metus vadovavau logistikos įmonei, mokiausi geštalto ir dramos terapijos. Dabar visa ši vidinė komanda dirba vienam tikslui: kad vadovai ir jų komandos būtų brandesni ir mažiau perdegę.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#kontaktai" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600">Susitikime pasikalbėti</a>
<a href="#paslaugos" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; border: 1px solid #111111; color: #111111; text-decoration: none; font-weight: 500">Ką siūlau</a>
</div>
</div>
<div style="flex: 1 1 400px; min-width: 0; display: flex; justify-content: center">
<article style="position: relative; width: 420px; max-width: 100%; background: #FFFFFF; border: 2px solid #111111; box-shadow: 10px 10px 0 #111111; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<div aria-hidden="true" style="position: absolute; right: 24px; top: 22px; transform: rotate(-12deg); border: 3px solid {{accent}}; color: {{accent}}; padding: 4px 10px; font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.1em">{{ stamp }}</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #555555">VIDINIS SUSIRINKIMAS</span>
<h2 style="margin: 0; font-size: 22px; font-weight: 600">Protokolas Nr. 7</h2>
<span style="display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: #555555">Dalyvauja: 7 iš 7 · <span aria-hidden="true" class="cc-dot" style="width: 7px; height: 7px; border-radius: 999px; background: {{ liveDot }}"></span>{{ liveLabel }}</span>
</div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px dashed #999999">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
<li style="position: relative; border-bottom: 1px dashed #999999">
<sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" class="{{ barClass }}" style="position: absolute; left: -8px; bottom: -1px; height: 2px; background: {{accent}}; z-index: 1"></span></sc-if>
<button type="button" onClick="{{ it.pick }}" aria-pressed="{{ it.on }}" style="width: 100%; min-height: 44px; padding: 8px 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; background: {{ it.rowBg }}; font: inherit; font-size: 14px; color: #111111; transition: background 200ms ease; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
<span aria-hidden="true" style="flex: 0 0 18px; height: 18px; border: 2px solid {{ it.border }}; background: {{ it.bg }}; color: #FFFFFF; font-size: 12px; line-height: 14px; text-align: center">{{ it.mark }}</span>
<span>{{ it.nr }}. Kalba: {{ it.name }}</span>
</button>
</li>
</sc-for>
</ol>
<p aria-live="polite" style="margin: 0; min-height: 66px; font-size: 14px; line-height: 1.55"><strong style="color: {{accent}}">NUTARTA:</strong> {{ line }}</p>
</article>
</div>
</div>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: 112px 32px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px 64px">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}">01 — Kodėl</span>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.02; letter-spacing: -0.025em">Viršuje dažnai būna vieniša.</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 20px; font-size: 18px; line-height: 1.65; color: #3A3A3A">
<p style="margin: 0">Vadovas atsako už rezultatus, žmones ir procesus. Bet retai turi vietą, kur galėtų sustoti ir pažiūrėti į save: kaip jaučiasi, kaip priima sprendimus, ką jo būsena daro komandai.</p>
<p style="margin: 0">Aš ten buvau pats: 24 metai, ~170 žmonių, sandėliai ir temperatūriniai režimai. Todėl kalbu kaip kolega, o ne iš knygos.</p>
</div>
</section>

<section id="paslaugos" style="max-width: 1280px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}">02 — Paslaugos</span>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.02; letter-spacing: -0.025em">Kam ieškote pagalbos?</h2>
</div>
<div role="group" aria-label="Pasirinkite" style="display: flex; flex-wrap: wrap; border: 1px solid #111111">
<sc-for list="{{ auds }}" as="a" hint-placeholder-count="3">
<button type="button" onClick="{{ a.pick }}" aria-pressed="{{ a.on }}" style="min-height: 48px; padding: 0 20px; border: 0; background: {{ a.bg }}; color: {{ a.fg }}; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{ a.label }}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{ services }}" as="v" hint-placeholder-count="3">
<article style="border: 2px solid {{ v.border }}; background: {{ v.bg }}; padding: 28px; display: flex; flex-direction: column; gap: 14px; transition: background 200ms ease">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-family: 'Inter Tight', sans-serif; font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; color: {{ v.letterColor }}">{{ v.letter }}</span>
<sc-if value="{{ v.on }}" hint-placeholder-val="{{ false }}"><span style="padding: 4px 10px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">Jums tinka</span></sc-if>
</div>
<h3 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{ v.title }}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3A3A3A">{{ v.text }}</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #3A3A3A">
<sc-for list="{{ v.points }}" as="pt" hint-placeholder-count="3"><li style="display: flex; gap: 8px"><span aria-hidden="true" style="color: {{accent}}">→</span>{{ pt }}</li></sc-for>
</ul>
<span style="margin-top: auto; font-size: 14px; color: #555555">{{ v.meta }}</span>
</article>
</sc-for>
</div>
</section>

<section id="kaip" style="background: #F4F4F2">
<div style="max-width: 1280px; margin: 0 auto; padding: 96px 32px; display: flex; flex-direction: column; gap: 32px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}">03 — Kaip dirbu</span>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px">
<sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
<li><button type="button" onClick="{{ st.pick }}" aria-pressed="{{ st.on }}" style="width: 100%; min-height: 72px; padding: 16px 18px; border: 0; border-bottom: 4px solid {{ st.bar }}; background: {{ st.bg }}; color: #111111; font: inherit; text-align: left; cursor: pointer; display: flex; gap: 14px; align-items: center">
<span style="font-family: 'Inter Tight', sans-serif; font-size: 30px; font-weight: 700; color: {{ st.numColor }}">{{ st.n }}</span>
<span style="font-family: 'Inter Tight', sans-serif; font-size: 18px; font-weight: 600">{{ st.title }}</span>
</button></li>
</sc-for>
</ol>
<div aria-live="polite" style="background: #FFFFFF; padding: 36px; display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-start">
<h3 style="flex: 1 1 280px; margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 34px; font-weight: 600; letter-spacing: -0.02em">{{ step.title }}</h3>
<div style="flex: 2 1 420px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3A3A3A">{{ step.text }}</p>
<span style="font-size: 14px; font-weight: 600; color: {{accent}}">{{ step.meta }}</span>
</div>
</div>
</div>
</section>

<section aria-label="Savitikra" style="max-width: 1280px; margin: 0 auto; padding: 112px 32px; display: flex; flex-wrap: wrap; gap: 48px 64px">
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}">04 — Greita savitikra</span>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.02; letter-spacing: -0.025em">Ar jūsų komandai laikas susirinkimui?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #555555">Pažymėkite, kas skamba pažįstamai. Niekas nemato, niekas nevertina.</p>
</div>
<div style="flex: 2 1 520px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ checks }}" as="q" hint-placeholder-count="5">
<button type="button" onClick="{{ q.toggle }}" aria-pressed="{{ q.on }}" style="min-height: 56px; padding: 12px 18px; border: 1px solid {{ q.border }}; background: {{ q.bg }}; color: #111111; font: inherit; font-size: 16px; text-align: left; cursor: pointer; display: flex; gap: 14px; align-items: center">
<span aria-hidden="true" style="flex: 0 0 22px; height: 22px; border: 2px solid {{ q.box }}; background: {{ q.boxBg }}; color: #FFFFFF; font-size: 14px; line-height: 18px; text-align: center">{{ q.mark }}</span>{{ q.text }}</button>
</sc-for>
<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
<div aria-hidden="true" style="height: 12px; background: #EEEEEE"><div style="height: 100%; width: {{ meter }}; background: {{accent}}; transition: width 250ms ease"></div></div>
<p aria-live="polite" style="margin: 0; font-family: 'Inter Tight', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">{{ verdict }}</p>
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ false }}"><a href="#kontaktai" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600">Užsakyti pokalbį</a></sc-if>
</div>
</div>
</section>

<section aria-label="Dažni klausimai" style="border-top: 1px solid #111111">
<div style="max-width: 1280px; margin: 0 auto; padding: 96px 32px; display: flex; flex-wrap: wrap; gap: 32px 64px">
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}">05 — Klausimai</span>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.02; letter-spacing: -0.025em">Ko dažniausiai klausia</h2>
</div>
<ul style="flex: 2 1 560px; margin: 0; padding: 0; list-style: none; border-top: 1px solid #DDDDDD">
<sc-for list="{{ faq }}" as="f" hint-placeholder-count="5">
<li style="border-bottom: 1px solid #DDDDDD">
<button type="button" onClick="{{ f.toggle }}" aria-expanded="{{ f.on }}" style="width: 100%; min-height: 64px; padding: 16px 0; border: 0; background: none; color: #111111; font-family: 'Inter Tight', sans-serif; font-size: 20px; font-weight: 600; text-align: left; cursor: pointer; display: flex; justify-content: space-between; gap: 16px; align-items: center">{{ f.q }}<span aria-hidden="true" style="font-size: 24px; color: {{accent}}">{{ f.sign }}</span></button>
<sc-if value="{{ f.on }}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 20px; max-width: 720px; font-size: 17px; line-height: 1.6; color: #3A3A3A">{{ f.a }}</p></sc-if>
</li>
</sc-for>
</ul>
</div>
</section>

<section aria-label="Šiandienos energija" style="max-width: 1280px; margin: 0 auto; padding: 96px 32px; display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: center">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}">06 — Po protokolo</span>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.02; letter-spacing: -0.025em">Kur šiandien eina energija?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #555555">Septyni dalyviai, septyni energijos lygiai. Matuota subjektyviai, bet sąžiningai.</p>
</div>
<div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #555555">Šiandienos energija · subjektyviai</span>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #3A3A3A"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #2E9E6A"></span>Tarifas: pigiausias</span>
</div>
<div style="position: relative; height: 340px; border-bottom: 2px solid #111111; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; background: repeating-linear-gradient(0deg, #EEEEEE 0 1px, transparent 1px 68px)">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="7">
<button type="button" onClick="{{ b.pick }}" aria-pressed="{{ b.on }}" aria-label="{{ b.name }}" style="height: {{ b.h }}; min-height: 44px; border: 2px solid {{ b.border }}; background: {{ b.fill }}; color: {{ b.fg }}; cursor: pointer; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; font-family: 'Inter Tight', sans-serif; font-size: 16px; font-weight: 700">{{ b.nr }}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; font-size: 11px; color: #555555; text-align: center">
<span>Vadovas</span><span>Geštaltas</span><span>Drama</span><span>Rašymas</span><span>Bėgimas</span><span>Moto</span><span>Škoda</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between">
<p style="flex: 1 1 300px; margin: 0; min-height: 52px; font-size: 17px; line-height: 1.5"><strong style="font-weight: 600; color: {{accent}}">{{ ewho }}</strong> {{ eline }}</p>
<button type="button" onClick="{{ shuffle }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">

function look(path, scope) {
